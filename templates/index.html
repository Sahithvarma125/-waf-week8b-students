<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Information Management System</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 850px; margin: 40px auto; }
        input { width: 100%; padding: 8px; margin: 5px 0 12px; box-sizing: border-box; }
        button { padding: 9px 18px; }
        table { border-collapse: collapse; width: 100%; margin-top: 25px; }
        th, td { border: 1px solid #999; padding: 8px; }
    </style>
</head>
<body>
    <h2>Student Information Management System</h2>
    <p>GitHub workflow update: student records form and listing.</p>
    <form method="POST">
        <label>Roll Number</label>
        <input type="text" name="roll" required>
        <label>Student Name</label>
        <input type="text" name="name" required>
        <label>Department</label>
        <input type="text" name="department" required>
        <button type="submit">Add Student</button>
    </form>

    <h3>Student Records</h3>
    <table>
        <tr><th>Roll Number</th><th>Name</th><th>Department</th></tr>
        {% for student in students %}
        <tr><td>{{ student.roll }}</td><td>{{ student.name }}</td><td>{{ student.department }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
